name: Release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  pull_request:

jobs:
  release-container:
    uses: radiorabe/actions/.github/workflows/release-container.yaml@c26933dd78f0f76b51d1e3bb80ac099bfe0ee89b # v0.45.0
    with:
      image: 'ghcr.io/radiorabe/s2i-core' 
      name: 's2i-core'
      display-name: 'RaBe S2I Core Minimal'
      tags: 'minimal rhel9 rabe s2i'
      cosign-image-skip-regexp: quay.io/sclorg/s2i-core-c9s
      platforms: "linux/amd64,linux/arm64"
      docker-daemon-config: |
        {
          "features": {
            "containerd-snapshotter": true
          }
        }
  mkdocs:
    uses: radiorabe/actions/.github/workflows/release-mkdocs.yaml@c26933dd78f0f76b51d1e3bb80ac099bfe0ee89b # v0.45.0
  github-actions:
    permissions:
      contents: read
      security-events: write # so zizmor can publish results to the Security tab
    uses: radiorabe/actions/.github/workflows/test-github-actions.yaml@c26933dd78f0f76b51d1e3bb80ac099bfe0ee89b # v0.45.0
